<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somrido - Due Ledger Matrix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #1e293b; min-height: 100vh; padding: 20px; }
        .sidebar .nav-link { color: #94a3b8; font-weight: 600; margin-bottom: 10px; border-radius: 8px; }
        .sidebar .nav-link.active { background-color: #06b6d4; color: white; }
        .table-responsive { background-color: #1e293b; border-radius: 12px; padding: 20px; }
        .table { color: white; border-color: #334155; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar">
            <h4 class="text-info fw-bold mb-4"><i class="fa-solid fa-layer-group"></i> Somrido</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="members.html"><i class="fa-solid fa-users"></i> Member Profiles</a></li>
                <li class="nav-item"><a class="nav-link active" href="due-ledger.html"><i class="fa-solid fa-book-bookmark"></i> Due Ledger</a></li>
            </ul>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="fw-bold mb-4"><i class="fa-solid fa-circle-exclamation text-danger"></i> Defaulter & Due Ledger</h2>
            
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Member Name</th>
                            <th>Cell Number</th>
                            <th>Target Committed Amount</th>
                            <th>Total Installment Paid</th>
                            <th>Current Outstanding Due</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="due-ledger-tbody">
                        </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script type="module" src="../js/app.js"></script>
</body>
</html>
