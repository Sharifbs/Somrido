<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somrido Hub - Dashboard & Collections</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background-color: #1e293b; min-height: 100vh; padding: 20px; }
        .sidebar .nav-link { color: #94a3b8; font-weight: 600; margin-bottom: 10px; border-radius: 8px; }
        .sidebar .nav-link.active { background-color: #06b6d4; color: white; }
        .matrix-card { background-color: #1e293b; border-radius: 12px; padding: 22px; text-align: center; font-weight: bold; border: none; }
        .form-section { background-color: #1e293b; border-radius: 12px; padding: 25px; margin-top: 20px; }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid #334155; color: white; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; border-color: #06b6d4; color: white; box-shadow: none; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar">
            <div class="position-sticky">
                <h4 class="text-info fw-bold mb-4"><i class="fa-solid fa-layer-group"></i> Somrido Portal</h4>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="members.html"><i class="fa-solid fa-users"></i> Member Profiles</a></li>
                    <li class="nav-item"><a class="nav-link" href="due-ledger.html"><i class="fa-solid fa-book-bookmark"></i> Due Ledger</a></li>
                </ul>
                <hr class="text-secondary">
                <button id="logout-btn" class="btn btn-outline-danger btn-sm w-100"><i class="fa-solid fa-power-off"></i> Logout</button>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom border-secondary">
                <h1 class="h2 fw-bold">Treasury Realtime Matrix</h1>
                <span class="badge bg-success p-2"><i class="fa-solid fa-cloud"></i> Firebase Live Connected</span>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-sm-4"><div class="matrix-card" style="color: #f97316;">Cash Balance<br><span id="cash-val" class="fs-4">0.00 Tk</span></div></div>
                <div class="col-12 col-sm-4"><div class="matrix-card" style="color: #ec4899;">bKash Balance<br><span id="bkash-val" class="fs-4">0.00 Tk</span></div></div>
                <div class="col-12 col-sm-4"><div class="matrix-card" style="color: #3b82f6;">Bank Balance<br><span id="bank-val" class="fs-4">0.00 Tk</span></div></div>
            </div>

            <div class="form-section">
                <h4 class="fw-bold text-info mb-3"><i class="fa-solid fa-cash-register"></i> New Collection Registry</h4>
                <form id="collection-form" class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label small text-secondary fw-bold">Select Member</label>
                        <select id="collect-member-select" class="form-select" required>
                            <option value="">Choose Member...</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label small text-secondary fw-bold">Collection Type</label>
                        <select id="collect-type" class="form-select" required>
                            <option value="Admission Fee">Admission Fee Collection</option>
                            <option value="Installment Fee">Installment Fee Collection</option>
                            <option value="Donation">Donation Collection</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label small text-secondary fw-bold">Payment Method</label>
                        <select id="collect-method" class="form-select" required>
                            <option value="cash">Cash Account</option>
                            <option value="bkash">bKash Portal</option>
                            <option value="bank">Bank Ledger</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small text-secondary fw-bold">Amount (Tk)</label>
                        <input type="number" step="0.01" id="collect-amount" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small text-secondary fw-bold">Remarks / Reference</label>
                        <input type="text" id="collect-remarks" class="form-control" placeholder="Installment No / Note">
                    </div>
                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-info text-white px-5 fw-bold"><i class="fa-solid fa-circle-check"></i> Post Collection</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/app.js"></script>
</body>
</html>
